<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>おりょうりまぜまぜ iPhone QR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff7d6;
        color: #332d29;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        text-align: center;
      }
      img {
        width: min(76vw, 420px);
        height: auto;
        border: 14px solid #fffdf7;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(90, 70, 42, .2);
      }
      p {
        font-size: 18px;
        line-height: 1.7;
      }
      code {
        overflow-wrap: anywhere;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>iPhoneでひらくQR</h1>
      <img src="iphone-qr.svg" alt="おりょうりまぜまぜを開くQRコード" />
      <p>iPhoneのカメラで読み込み、Safariで開いてください。</p>
      <p><code>https://fzr400r3en2-sys.github.io/oryouri-mazemaze/</code></p>
    </main>
  </body>
</html>
