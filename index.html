<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7d6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="まぜまぜ" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>おりょうりまぜまぜ</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // beforeinstallprompt は defer 付きスクリプトの登録より早く発火することが
      // あるため、最も早い段階で捕まえて window に保持しておく。
      window.__deferredInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__deferredInstallPrompt = event;
        window.dispatchEvent(new CustomEvent("oryouri:install-ready"));
      });
      window.addEventListener("appinstalled", function () {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent("oryouri:installed"));
      });
    </script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="app" class="app">
      <section class="screen screen-title is-active" data-screen="title" aria-labelledby="title-heading">
        <div class="title-kitchen" aria-hidden="true">
          <div class="title-pan"></div>
          <div class="title-bowl">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="title-copy">
          <h1 id="title-heading">おりょうり<br />まぜまぜ</h1>
          <p>すきな おりょうり</p>
        </div>

        <div id="recipeChoices" class="recipe-grid" aria-label="おりょうりをえらぶ"></div>

        <button id="startButton" class="primary-button" type="button">
          はじめる
        </button>
      </section>

      <section class="screen screen-pick" data-screen="pick" aria-labelledby="pick-heading">
        <header class="stage-header">
          <div id="pickRecipeMark" class="recipe-mark" aria-hidden="true"></div>
          <div>
            <p id="pickRecipeName" class="stage-label"></p>
            <h2 id="pick-heading">えらんで ぽん</h2>
          </div>
        </header>

        <div class="pick-layout">
          <div id="ingredientGrid" class="ingredient-grid" aria-label="ざいりょう"></div>

          <div class="bowl-panel">
            <div id="pickBowl" class="big-bowl pick-bowl" aria-label="ボウル">
              <div class="bowl-back"></div>
              <div id="pickBowlItems" class="bowl-items"></div>
              <div class="bowl-front"></div>
              <div id="pickBowlEffects" class="bowl-effects" aria-hidden="true"></div>
            </div>
            <button id="toMixButton" class="primary-button soft-hidden" type="button">
              まぜまぜへ
            </button>
          </div>
        </div>
      </section>

      <section class="screen screen-mix" data-screen="mix" aria-labelledby="mix-heading">
        <header class="stage-header">
          <div id="mixRecipeMark" class="recipe-mark" aria-hidden="true"></div>
          <div>
            <p id="mixRecipeName" class="stage-label"></p>
            <h2 id="mix-heading">ぐるぐる</h2>
          </div>
        </header>

        <div class="mix-layout">
          <div id="mixBowl" class="big-bowl mix-bowl" role="button" tabindex="0" aria-label="ボウルをまぜる">
            <div class="bowl-back"></div>
            <div id="mixture" class="mixture"></div>
            <div id="mixSwirl" class="mix-swirl" aria-hidden="true"></div>
            <div id="mixSpoon" class="mix-spoon" aria-hidden="true"></div>
            <div class="mix-guide" aria-hidden="true"></div>
            <div class="bowl-front"></div>
          </div>

          <div class="mix-controls">
            <div id="mixDots" class="mix-dots" aria-hidden="true"></div>
            <button id="mixButton" class="primary-button" type="button">
              まぜる
            </button>
          </div>
        </div>
      </section>

      <section class="screen screen-finish" data-screen="finish" aria-labelledby="finish-heading">
        <div id="finishBurst" class="finish-burst" aria-hidden="true"></div>

        <header class="finish-header">
          <p id="finishRecipeName" class="stage-label"></p>
          <h2 id="finish-heading">できあがり</h2>
        </header>

        <div id="resultPlate" class="result-plate" aria-label="できあがったおりょうり"></div>

        <div class="finish-actions">
          <button id="againButton" class="primary-button" type="button">
            もういっかい
          </button>
          <button id="otherButton" class="secondary-button" type="button">
            べつの おりょうり
          </button>
        </div>
      </section>
    </main>

    <aside id="installGuide" class="install-guide" aria-labelledby="install-guide-title" hidden>
      <div class="install-guide-text">
        <p id="install-guide-title">ホーム画面に追加</p>
        <p id="installGuideBody">アイコンから すぐに ひらけます</p>
      </div>
      <button id="installGuideAction" class="install-guide-action" type="button" hidden>
        ついか
      </button>
      <button id="installGuideClose" class="install-guide-close" type="button" aria-label="案内を閉じる">
        OK
      </button>
    </aside>
  </body>
</html>
