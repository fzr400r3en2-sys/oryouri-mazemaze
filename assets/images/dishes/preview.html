<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>完成料理SVG preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        color: #3f372f;
        background: linear-gradient(135deg, #fff8e9 0%, #f0f7ef 48%, #eaf6fb 100%);
      }
      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 18px 0 24px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(30px, 4vw, 46px);
        letter-spacing: 0;
        text-align: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }
      .card {
        display: grid;
        place-items: center;
        gap: 8px;
        min-height: 286px;
        padding: 16px;
        border: 4px solid rgba(183, 222, 205, .75);
        border-radius: 8px;
        background: rgba(255, 255, 255, .7);
        box-shadow: 0 14px 35px rgba(77, 59, 36, .12);
      }
      img {
        width: min(100%, 200px);
        aspect-ratio: 1;
        object-fit: contain;
      }
      h2 {
        margin: 0;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #756b61;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>完成料理SVG preview</h1>
      <div class="grid">
        <article class="card">
  <img src="pancake.svg" alt="ぱんけーき" />
  <h2>ぱんけーき</h2>
  <p>pancake.svg</p>
</article>
<article class="card">
  <img src="curry.svg" alt="かれー" />
  <h2>かれー</h2>
  <p>curry.svg</p>
</article>
<article class="card">
  <img src="juice.svg" alt="じゅーす" />
  <h2>じゅーす</h2>
  <p>juice.svg</p>
</article>
<article class="card">
  <img src="pudding.svg" alt="ぷりん" />
  <h2>ぷりん</h2>
  <p>pudding.svg</p>
</article>
<article class="card">
  <img src="jelly.svg" alt="ぜりー" />
  <h2>ぜりー</h2>
  <p>jelly.svg</p>
</article>
<article class="card">
  <img src="icecream.svg" alt="あいす" />
  <h2>あいす</h2>
  <p>icecream.svg</p>
</article>
      </div>
    </main>
  </body>
</html>
